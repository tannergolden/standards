# --- Cut Release: this repository's own, and any repository consumed by tag ---
#
# 🏷️ Cut Release
#
# Purpose: publishes a version and moves the major tag that consumers pin.
# Dispatched here, it releases these standards. Called from another
# repository's stub, it releases that repository the same way: any project
# whose deliverable is a tag (an action, a reusable workflow, a kit) needs
# exactly this, and the shared publisher cannot give it, because that one
# computes an information-rich tag with git-cliff and never writes a moving
# major. Called, never copied: the guards below are the reason, and a copy
# stops receiving them.
#
# ⚠️ THIS IS THE MOST CONSEQUENTIAL WORKFLOW HERE. Moving `v1` changes what
# every repository pinned to `@v1` executes, on their next run, without
# anyone on their side doing anything. Treat a release as a production
# change to every consumer at once.
#
# TWO TAGS, TWO CONTRACTS:
#   vX.Y.Z  the version just cut. Never moved while it exists, and pruned,
#           page and tag, when the next version supersedes it, so a
#           repository carries the major and the one version it points at
#           and nothing older. For exactness pin a commit SHA, which nothing
#           here deletes.
#   vX      moving. Re-pointed at each release in that major line. The
#           normal pin, and the reason a fix reaches everyone.
#
# A change that renames a required check, removes an input, or changes a
# default in a way that alters behavior is BREAKING, and belongs in a new
# major line rather than a move of the current one.
#
# ---

name: '🏷️ Cut Release'

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, as vX.Y.Z'
        required: true
        type: string
      move-major:
        description: 'Also move the major tag (vX) to this release'
        required: false
        type: boolean
        default: true
  # The same run, from a stub in the repository being released. The stub's
  # dispatch form carries version and move-major; the two inputs below are
  # what that repository knows about itself and this file cannot.
  workflow_call:
    inputs:
      version:
        description: 'Version to publish, as vX.Y.Z'
        required: true
        type: string
      move-major:
        description: 'Also move the major tag (vX) to this release'
        required: false
        type: boolean
        default: true
      required-files:
        description: >-
          Files a consumer resolves at the tag, space-separated: the action,
          the reusable workflow, the kit. A release is refused if any is
          missing at this commit, rather than discovered by a consumer's run.
        required: false
        type: string
        default: ''
      check-command:
        description: >-
          A command that proves the release candidate at this commit, run
          from the repository root: a self-test, a golden hash, `make check`.
          Empty runs nothing.
        required: false
        type: string
        default: ''

permissions: {}

jobs:
  release:
    name: '🏷️ Publish Version & Move Major Tag'
    # One release at a time. Declared on the job rather than the workflow:
    # a called workflow carries no top-level concurrency of its own, and the
    # calling stub's is the caller's to set.
    concurrency:
      group: ${{ github.workflow }}-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags and publish the release
    steps:
      - name: '🛡️ Harden Runner'
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: '🔍 Validate Version'
        id: check
        env:
          # `gh api` reads the published releases below to prove this version
          # moves forward. Without a token it runs unauthenticated, the read
          # fails, and the guard's fail-safe branch aborts every release: the
          # check cannot tell "no token" from "cannot reach the API", and
          # refuses rather than assuming. That is the right behaviour for the
          # guard and the wrong outcome for the workflow, so the token belongs
          # here.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Release::'$VERSION' is not a vX.Y.Z version."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error title=Release::Tag '$VERSION' already exists. A published version is immutable; cut a new patch instead."
            exit 1
          fi

          # ⚠️ THE DISPATCH REF IS NOT TRUSTED. `workflow_dispatch` carries
          # no branch restriction, so the ref selector on the form can name
          # any branch in the repository, and the checkout above takes it.
          # Without this, anyone with write access could publish `v1.4.0`
          # from an unmerged branch and force-move `v1` onto its HEAD, which
          # every consumer pinned to `@v1` would then execute on their next
          # run. Nothing downstream would look unusual.
          #
          # Tested by ANCESTRY rather than by branch name: what has to be
          # true is that this commit is already on the default branch, which
          # stays true for a legitimate re-cut from an earlier merged commit
          # and does not care what the ref happened to be called.
          BASE="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git rev-parse -q --verify "$BASE" >/dev/null; then
            echo "::error title=Release::Could not resolve '${BASE}' to check that this commit is on the release line. The checkout needs fetch-depth: 0. Refusing to publish rather than guessing."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD "$BASE"; then
            echo "::error title=Release::This commit is not on the default branch '${DEFAULT_BRANCH}'. A release is cut from merged, reviewed code: moving the major tag onto anything else hands unreviewed code to every repository pinned to it. Merge first, then dispatch against the default branch."
            exit 1
          fi

          # ⚠️ A RELEASE ONLY EVER MOVES FORWARD. Neither of the two
          # publishing steps checks ordering on its own: `gh release create
          # --latest` marks whatever it is handed as the latest release, and
          # `git tag -f` moves the major pointer onto it. Publishing a
          # version older than the current one therefore moves both
          # backwards, and every repository pinned to `@v1` DOWNGRADES on
          # its next run.
          #
          # The tag check above catches only the version that still has its
          # tag, the latest, since the prune below removes every older one.
          # This check covers the rest: an older version whose tag is gone,
          # an imported repository, or a mistyped line.
          #
          # `sort -V` orders numerically, so v1.10.0 is correctly newer than
          # v1.9.0. A string comparison gets that backwards.
          if ! PUBLISHED="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | select(.draft == false) | .tag_name' 2>&1)"; then
            echo "::error title=Release::Could not read the existing releases of ${GITHUB_REPOSITORY} to check this version moves forward: ${PUBLISHED}. Refusing to publish rather than assuming."
            exit 1
          fi
          LATEST="$(printf '%s\n' "$PUBLISHED" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -n "$LATEST" ]; then
            NEWEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n 1)"
            if [ "$NEWEST" != "$VERSION" ] || [ "$VERSION" = "$LATEST" ]; then
              echo "::error title=Release::'$VERSION' is not newer than the current release '$LATEST'. Publishing it would mark an older version as latest and move the major tag backwards, downgrading every repository pinned to it."
              exit 1
            fi
          fi

          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      # Actions resolve `uses:` against the ref they are called at, so every
      # action a workflow names must exist at the tag being cut. Checked
      # here rather than discovered by a consumer's failing run. This one is
      # about these standards' own action tree, so it runs only here; a
      # calling repository names what it ships through required-files.
      - name: '🔗 Verify Internal References Resolve'
        if: ${{ github.repository == 'tannergolden/standards' }}
        run: |
          set -euo pipefail
          missing=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            if [ ! -f "${ref}/action.yml" ]; then
              echo "::error title=Release::A workflow references ${ref}, which does not exist at this commit."
              missing=1
            fi
          done < <(grep -rhoE 'tannergolden/standards/(actions/[A-Za-z0-9._-]+)@' .github/workflows/ \
                   | sed -E 's|tannergolden/standards/||; s|@$||' | sort -u)
          [ "$missing" -eq 0 ] || exit 1
          echo "Every referenced action exists at this commit."

      # What the calling repository promises its consumers, proven at the
      # commit about to become the tag: the files a `uses:` resolves, and
      # the check that shows the code works. A stub passes both; a dispatch
      # here passes neither, and the step says so and moves on.
      - name: '🧪 Verify The Release Candidate'
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
          CHECK_COMMAND: ${{ inputs.check-command }}
        run: |
          set -euo pipefail
          missing=0
          for f in $REQUIRED_FILES; do
            if [ ! -f "$f" ]; then
              echo "::error title=Release::${f} does not exist at this commit, but a consumer resolves it at the tag."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          if [ -n "$CHECK_COMMAND" ]; then
            echo "Running the release candidate's check: $CHECK_COMMAND"
            bash -eo pipefail -c "$CHECK_COMMAND"
          else
            echo "No check-command given; nothing beyond the file list to prove."
          fi

      # ⚠️ THE TAGS HERE ARE LIGHTWEIGHT, DELIBERATELY. A lightweight tag is a
      # ref and nothing else: no tag object, so no tagger, no message, and
      # nothing that can carry a signature or lack one. What GitHub displays
      # for it is the COMMIT, which is signed and verified.
      #
      # An annotated tag is a second object needing a second signature, which
      # meant a private key in repository secrets. That key is readable by
      # anything that can run here, and it would have been a key whose leak
      # forges commits as its owner everywhere, not only in this repository.
      # The metadata bought by that risk was a tagger and a one-line message
      # nobody reads, on a pointer that gets force-moved every release.
      #
      # The release page already records who published, when, and what
      # changed. Nothing is actually lost.
      - name: '🏷️ Tag and Publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ steps.check.outputs.major }}
          MOVE_MAJOR: ${{ inputs.move-major }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git tag "$VERSION"
          git push "$REMOTE" "$VERSION"
          echo "Published tag $VERSION."

          if [ "$MOVE_MAJOR" = "true" ]; then
            # Force-moved by design: this IS the moving major tag, and
            # moving it is what makes a fix reach everyone pinned to it.
            git tag -f "$MAJOR"
            git push --force "$REMOTE" "$MAJOR"
            echo "::warning title=Major tag moved::${MAJOR} now points at ${VERSION}. Every repository pinned to @${MAJOR} runs this code on its next workflow run."
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --latest

          {
            echo "### 🏷️ Released $VERSION"
            echo ""
            echo "| Tag | Meaning |"
            echo "| :--- | :--- |"
            echo "| \`$VERSION\` | This release. Pruned when the next one is cut; pin a commit SHA for exactness. |"
            if [ "$MOVE_MAJOR" = "true" ]; then
              echo "| \`$MAJOR\` | Now points here. Every consumer pinned to it runs this next. |"
            fi
            echo ""
            echo "Consumers pin \`${GITHUB_REPOSITORY}@${MAJOR}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # After the release publishes and the major tag moves, the releases it
  # superseded come down, page and tag. This lives INSIDE Cut Release rather
  # than on a release-event listener so the whole chain is one run: cut,
  # move, prune.
  #
  # ⚠️ THE TAG GOES WITH THE PAGE. Two tags survive a release: the bare
  # major, which is the pin every stub resolves, and the version just cut,
  # which it points at. Everything older is pruned, including tags an
  # earlier prune left behind with no page, so a repository consumed by tag
  # never carries more than those two. Three other files say the same
  # thing, and tests/release-tag-contract.py holds all four to it:
  #
  #   README.md               offers a version pin as a pin for the moment,
  #                           pruned at the next release, and a commit SHA
  #                           as the one for exactness.
  #   data/README.md          says a version tag is never moved while it
  #                           exists, and is pruned when superseded.
  #   protect-release-tags    enforces exactly that: `refs/tags/v*.*.*` with
  #                           `update` and `non_fast_forward` rules and no
  #                           `deletion` rule, so this prune runs without a
  #                           bypass while a version can still never be
  #                           re-pointed.
  #
  # This once read the other way, keeping every version tag as an immutable
  # pin, and the ruleset carried a `deletion` rule that would have refused
  # this very prune. Nothing on this account pins a full version, so a tag
  # nothing resolves is clutter, and the release history reads as one line:
  # the major, and the version it stands on.
  #
  # Named in full rather than as `./`: a local path resolves against the
  # repository whose workflow started the run, and when a stub elsewhere
  # calls this file that is not this repository.
  prune:
    name: '🧹 Prune Superseded Releases'
    needs: release
    permissions:
      contents: write # deleting release pages and their tags requires write
    uses: tannergolden/standards/.github/workflows/prune-releases.yml@v1
    with:
      keep: 1
      delete-tags: true
      dry-run: false
