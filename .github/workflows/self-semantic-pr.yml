# --- Trigger Stub ---
#
# Pull request integrity for this repository: title, branch name, and DCO
# sign-off, using the workflow it publishes.
#
# ---

name: '🔁 Self: Semantic Pull Request'

on:
  pull_request_target:
    types: [opened, edited, synchronize]

concurrency:
  # Keyed per pull request: under pull_request_target github.ref is the BASE
  # branch, so a branch-keyed group would put every open pull request into a
  # single queue slot.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# ⚠️ THE `permissions:` BELOW IS A CEILING, NOT A GRANT. For a job that calls a
# reusable workflow, the caller's permissions cap what the called workflow may
# request. Anything it asks for beyond them fails the run before a single job
# starts: a startup failure, with no job, no step, and no log to read.
#
# They are written out rather than left to this repository's DEFAULT token
# permissions, because a repository set to read-only - now the common default -
# caps every write scope the same invisible way.
#
# The list is the union of what the called workflow's own jobs ask for, and
# each of those jobs still narrows it further from there. Widen it only to
# match a scope the called workflow actually declares.

permissions: {}

jobs:
  pr: # <- fixed by the rulesets. Do not rename.
    permissions:
      pull-requests: read # read the PR title under validation
      statuses: write # publish the semantic-title status check on the PR
    uses: ./.github/workflows/semantic-pr.yml
