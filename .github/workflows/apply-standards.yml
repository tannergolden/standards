# --- Reusable Workflow ---
#
# 🎯 Apply Standards
#
# Purpose: writes the label taxonomy into a repository, and optionally the
# branch and tag rulesets. Two jobs, nothing else.
#
# ⚠️ IT DOES NOT INSTALL STUBS. It once did, and the trigger files now ship
# in the template repositories instead, which is where a consumer gets them.
# GitHub only runs a workflow living in the repository being pushed to, so
# the stub is still the one thing a consumer must hold; it simply arrives by
# generating from a template rather than by a pull request from here.
#
# ⚠️ RULESETS REQUIRE AN ADMIN TOKEN. The default GITHUB_TOKEN cannot write
# them at all, no matter what permissions the job requests. Provide a PAT or
# GitHub App token with administration write as ADMIN_TOKEN. Without one,
# labels still apply and the ruleset step says clearly why it was skipped.
#
# ⚠️ RUN IT WITH dry-run FIRST. A ruleset names required status checks, and
# a check that never reports blocks every merge in the repository. The dry
# run prints exactly what would be created or updated and changes nothing.
#
# THE CHECK NAMES DEPEND ON YOUR STUB JOB IDS. A called workflow reports as
# `<job id> / <job name>`, so the published rulesets expect the job ids
# documented in data/README.md. Use different ids and the checks will not
# match. Either match them or pass your own rulesets directory.
#
# Called, not triggered. A consuming repository adds a stub:
#
#   name: '🎯 Apply Standards'
#   on:
#     workflow_dispatch:
#       inputs:
#         dry-run:
#           type: boolean
#           default: true
#   permissions: {}
#   jobs:
#     apply:
#       permissions:
#         contents: read # check the repository out when labels-file names a file in it
#         issues: write # create and update labels
#       uses: tannergolden/standards/.github/workflows/apply-standards.yml@v1
#       with:
#         apply-rulesets: true
#         dry-run: ${{ inputs.dry-run }}
#       secrets: inherit
#
# ---

name: '🎯 Apply Standards'

on:
  workflow_call:
    inputs:
      apply-labels:
        description: 'Write the shared label taxonomy. Create-or-update, never pruning.'
        required: false
        type: boolean
        default: true
      apply-settings:
        description: >-
          Write the repository settings: squash-only merges, the pull
          request title and body as the commit, head branches deleted on
          merge, auto-merge available, and the security features. Off by
          default because it needs the same admin token the rulesets do.
        required: false
        type: boolean
        default: false
      apply-rulesets:
        description: >-
          Write the branch and tag rulesets. Off by default because a
          ruleset can block every merge in the repository, and needs an
          admin token.
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'For settings and rulesets: print what would be applied and change nothing.'
        required: false
        type: boolean
        default: true
      labels-file:
        description: 'Path to a label taxonomy in the CALLING repository. Empty uses the shared one.'
        required: false
        type: string
        default: ''
      rulesets-dir:
        description: 'Path to a rulesets directory in the CALLING repository. Empty uses the shared set.'
        required: false
        type: string
        default: ''
      settings-file:
        description: 'Path to a settings JSON in the CALLING repository. Empty uses the shared one.'
        required: false
        type: string
        default: ''
    secrets:
      ADMIN_TOKEN:
        description: >-
          Token with administration write on this repository. Required for
          settings and for rulesets; the default GITHUB_TOKEN can write
          neither, whatever permissions the job requests.
        required: false

permissions: {}

jobs:
  labels:
    name: '🏷️ Apply Label Taxonomy'
    if: ${{ inputs.apply-labels }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check the calling repository out when labels-file names a file in it
      issues: write # create and update labels
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🏷️ Standards: applying the shared label taxonomy.'

      # Checked out only when an override path is given, since the shared
      # taxonomy travels with the action and needs no tree.
      - name: '📂 Checkout Calling Repository'
        if: ${{ inputs.labels-file != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🔖 Sync Labels'
        uses: tannergolden/standards/actions/sync-labels@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          labels-file: ${{ inputs.labels-file }}
          dry-run: ${{ inputs.dry-run }}

  settings:
    name: '⚙️ Apply Repository Settings'
    if: ${{ inputs.apply-settings }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit

      # Same failure mode as the rulesets job, same early exit. A 403 from
      # the settings endpoint reads like a bug rather than a missing token.
      - name: '🔑 Verify Admin Token'
        env:
          HAVE_ADMIN: ${{ secrets.ADMIN_TOKEN != '' }}
        run: |
          if [ "$HAVE_ADMIN" != "true" ]; then
            echo "::error title=Admin token required::Repository settings need a token with administration write. The default GITHUB_TOKEN cannot change them regardless of the permissions this job requests. Add a PAT or GitHub App token as the ADMIN_TOKEN secret, or set apply-settings to false."
            exit 1
          fi

      - name: '📂 Checkout Calling Repository'
        if: ${{ inputs.settings-file != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '⚙️ Apply Repository Settings'
        uses: tannergolden/standards/actions/apply-repo-settings@v1
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          settings-file: ${{ inputs.settings-file }}
          dry-run: ${{ inputs.dry-run }}

  rulesets:
    name: '🛡️ Apply Rulesets'
    if: ${{ inputs.apply-rulesets }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit

      # Fail early and say why. The alternative is a 403 from the API that
      # reads like a bug rather than a missing token.
      - name: '🔑 Verify Admin Token'
        env:
          HAVE_ADMIN: ${{ secrets.ADMIN_TOKEN != '' }}
        run: |
          if [ "$HAVE_ADMIN" != "true" ]; then
            echo "::error title=Admin token required::Rulesets need a token with administration write. The default GITHUB_TOKEN cannot write them regardless of the permissions this job requests. Add a PAT or GitHub App token as the ADMIN_TOKEN secret, or set apply-rulesets to false."
            exit 1
          fi

      - name: '📂 Checkout Calling Repository'
        if: ${{ inputs.rulesets-dir != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🛡️ Apply Rulesets'
        uses: tannergolden/standards/actions/apply-rulesets@v1
        with:
          token: ${{ secrets.ADMIN_TOKEN }}
          rulesets-dir: ${{ inputs.rulesets-dir }}
          dry-run: ${{ inputs.dry-run }}

      - name: '📝 Next Step'
        if: ${{ inputs.dry-run }}
        run: |
          {
            echo ""
            echo "> [!NOTE]"
            echo "> This was a dry run. Re-run with \`dry-run: false\` to apply, once the plan above looks right."
          } >> "$GITHUB_STEP_SUMMARY"
