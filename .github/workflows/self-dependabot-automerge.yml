# --- Trigger Stub ---
#
# This repository automating its own Dependabot updates. A stub exactly like
# the one a consumer writes, which is the point: the standards are proven by
# being used, not asserted.
#
# The `uses:` here is a LOCAL path rather than a pinned tag, and only because
# this is the repository that publishes them. Every consumer pins a tag
# instead, so a change here cannot reach them until they move the pin.
#
# ⚠️ THIS REPOSITORY IS WHERE IT MATTERS MOST, and it was the one place it was
# missing. Twenty-four third-party actions are pinned here across sixty-five
# call sites, and those pins are what every consuming repository executes.
# Without this stub nothing approved, nothing queued, and the title
# normalisation in the called workflow never ran - which is exactly how eight
# non-conforming subjects reached this repository's permanent history.
#
# ⚠️ MERGING HERE IS NOT PUBLISHING. An approved bump lands on Development and
# goes no further: consumers pin a tag, so nothing reaches them until someone
# deliberately runs Cut Release and moves the major tag. That containment is
# what makes automating this side safe.
#
# Major bumps are still left for a human by the called workflow, which is
# where breaking changes live.
#
# ---

name: '🔁 Self: Automate Dependabot'

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# ⚠️ THE `permissions:` BELOW IS A CEILING, NOT A GRANT. For a job that calls a
# reusable workflow, the caller's permissions cap what the called workflow may
# request. Anything it asks for beyond them fails the run before a single job
# starts: a startup failure, with no job, no step, and no log to read.
#
# They are written out rather than left to this repository's DEFAULT token
# permissions, because a repository set to read-only - now the common default -
# caps every write scope the same invisible way.
#
# The list is the union of what the called workflow's own jobs ask for, and
# each of those jobs still narrows it further from there. Widen it only to
# match a scope the called workflow actually declares.

permissions: {}

jobs:
  dependabot:
    permissions:
      contents: write # allow the squash merge once required checks pass
      pull-requests: write # approve the pull request, and retitle it
    uses: ./.github/workflows/dependabot-automerge.yml
    secrets: inherit # zizmor: ignore[secrets-inherit] - first-party callee in this repository.
