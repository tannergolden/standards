# --- Reusable Workflow ---
#
# 🧹 Prune Releases
#
# Purpose: keeps the Releases page showing what is current, by deleting
# PUBLISHED releases that a newer one has superseded. The most recent
# `keep` releases survive; everything older is removed.
#
# ⚠️ THIS DELETES PUBLISHED RELEASES. That is a different act from the other
# two prunes in this repository:
#
#   prune.yml         workflow runs and deployments. Regenerated by the next
#                     run, so losing one costs a log nobody was reading.
#   prune-drafts.yml  drafts only. A draft published nothing, so deleting it
#                     removes nothing anyone could have consumed.
#   THIS ONE          published releases. Someone may have linked to the
#                     notes, and the notes are the only changelog there is.
#
# ⚠️ DELETING A RELEASE DOES NOT DELETE ITS TAG unless you ask. A release is
# a page; a tag is a contract. `vX.Y.Z` is documented in `release.yml` as
# immutable, and anything pinned to it keeps resolving after its release page
# is gone. Leave `delete-tags` false wherever consumers pin a full version.
#
# Turn it on only where they pin the MOVING MAJOR instead, which is how this
# repository is consumed: `@v1` is the pin, so a superseded `v1.2.0` has
# nothing resolving to it and its tag is just clutter.
#
# ⚠️ A BARE MAJOR TAG IS NEVER DELETED, whatever `delete-tags` says. `v1` is
# the pointer every consumer resolves; deleting it breaks every one of them
# at once. It carries no release, so the prune should never see it, and the
# guard below means a stray release attached to one cannot take it out.
#
# The release list is snapshotted in full before anything is deleted.
# Deleting while pagination is still fetching shifts the pages underneath
# the iterator, which double-visits some entries and 404s on others.
#
# `dry-run` defaults to TRUE here, unlike the other prunes. A caller that
# forgets the input gets a plan rather than a deletion, which is the right
# way round for something irreversible.
#
# Called, not triggered. A consuming repository adds a stub:
#
#   name: '🧹 Prune Releases'
#   on:
#     release:
#       types: [published]
#     workflow_dispatch:
#       inputs:
#         dry-run:
#           type: boolean
#           default: true
#   concurrency:
#     group: ${{ github.workflow }}
#     cancel-in-progress: false
#   permissions: {}
#   jobs:
#     prune:
#       permissions:
#         contents: write # deleting releases requires write
#       uses: tannergolden/standards/.github/workflows/prune-releases.yml@v1
#       with:
#         keep: 1
#         dry-run: ${{ inputs.dry-run || false }}
#
# ---

name: '🧹 Prune Releases'

on:
  workflow_call:
    inputs:
      keep:
        description: 'How many of the most recent published releases to keep.'
        required: false
        type: number
        default: 1
      dry-run:
        description: 'Log what would be deleted and delete nothing.'
        required: false
        type: boolean
        default: true
      include-prereleases:
        description: 'Consider prereleases for deletion too. Off by default, so a prerelease line is never pruned by a stable release.'
        required: false
        type: boolean
        default: false
      delete-tags:
        description: 'Also delete the tag behind each deleted release. Breaks every pin to that version.'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  prune:
    name: '🧹 Delete Superseded Releases'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # deleting releases, and optionally their tags, requires write
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🧹 Prune Releases: deletes published releases that a newer one supersedes. Tags are kept unless delete-tags is on; a bare major tag is kept regardless.'

      - name: '🧹 Prune'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEEP: ${{ inputs.keep }}
          DRY_RUN: ${{ inputs.dry-run }}
          INCLUDE_PRERELEASES: ${{ inputs.include-prereleases }}
          DELETE_TAGS: ${{ inputs.delete-tags }}
        run: |
          set -euo pipefail

          # Keeping zero releases would empty the page in one run, and no
          # caller means that. Refuse rather than interpret it.
          if [ "$KEEP" -lt 1 ]; then
            echo "::error::keep must be at least 1; got ${KEEP}. Refusing to delete every release."
            exit 1
          fi

          # Snapshot the FULL list before deleting anything: see the header.
          # --jq '.[]' streams one object per line across every page, so the
          # pages are all fetched before the first delete is issued.
          gh api --paginate "repos/${REPO}/releases" --jq '.[] | @json' > /tmp/releases.jsonl

          # Drafts belong to prune-drafts.yml. Prereleases are excluded unless
          # asked for, so cutting a stable release never removes the
          # prerelease line someone is still testing against.
          ordered="$(jq -s \
            --argjson pre "$INCLUDE_PRERELEASES" '
              map(select(.draft == false))
              | (if $pre then . else map(select(.prerelease == false)) end)
              | sort_by(.published_at)
              | reverse
            ' /tmp/releases.jsonl)"

          total="$(jq 'length' <<<"$ordered")"
          doomed="$(jq --argjson keep "$KEEP" '.[$keep:]' <<<"$ordered")"
          count="$(jq 'length' <<<"$doomed")"

          echo "Eligible releases: ${total}   keeping: ${KEEP}   deleting: ${count}"
          echo

          jq -r --argjson keep "$KEEP" '.[:$keep][] | "  KEEP    \(.tag_name)  (\(.published_at))"' <<<"$ordered"
          jq -r '.[] | "  DELETE  \(.tag_name)  (\(.published_at))"' <<<"$doomed"
          echo

          if [ "$count" -eq 0 ]; then
            echo "Nothing to prune."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: nothing was deleted. Set dry-run: false to apply this plan."
            exit 0
          fi

          if [ "$DELETE_TAGS" = "true" ]; then
            echo "::warning::delete-tags is on. Every pin to a full version below will stop resolving."
          fi

          while read -r tag; do
            args=(--yes)
            if [ "$DELETE_TAGS" = "true" ]; then
              # A bare major is the moving pointer consumers pin, not a
              # release artifact. Never delete one, whatever was asked for.
              if printf '%s' "$tag" | grep -qE '^v[0-9]+$'; then
                echo "::notice::Keeping the tag ${tag}: a bare major is a moving pointer, not a version."
              else
                args+=(--cleanup-tag)
              fi
            fi
            echo "Deleting release ${tag}"
            gh release delete "$tag" --repo "$REPO" "${args[@]}"
          done < <(jq -r '.[].tag_name' <<<"$doomed")

          echo
          echo "Deleted ${count} release(s)."
