# --- Reusable Workflow ---
#
# 🔐 Scan for Secrets
#
# Purpose: scans a repository's full history for committed secrets,
# credentials, and tokens. History depth matters here: a secret removed in a
# later commit is still a leaked secret, so this checks out everything rather
# than the tip.
#
# RULESET-LOAD-BEARING JOB NAME: '🔍 Scan for Secrets' is a required status
# check. A caller reports it as '<job id> / 🔍 Scan for Secrets', which is
# why the stub job id is fixed at `secrets` (see data/README.md). Renaming
# either half leaves branch protection waiting on a check that never
# reports, which blocks every merge and looks like a hung pull request
# rather than a naming mistake.
#
# Called, not triggered. A consuming repository adds a stub:
#
#   name: '🔐 Scan for Secrets'
#   on:
#     push:
#       branches: ['Experimental', 'Development', 'Preview', 'Release']
#     pull_request:
#       branches: ['Experimental', 'Development', 'Preview', 'Release']
#     merge_group: # a merge queue waits on every required check
#     workflow_dispatch:
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: false
#   permissions: {}
#   jobs:
#     secrets: # <- fixed by the rulesets. Do not rename.
#       permissions:
#         contents: read # full-history checkout for the secret scan
#         issues: write # one-time escalation issue when scanning is silently off
#       uses: tannergolden/standards/.github/workflows/gitleaks.yml@v1
#       secrets: inherit
#
# ---

name: '🔐 Scan for Secrets'

on:
  workflow_call:
    secrets:
      GITLEAKS_LICENSE:
        description: >-
          Free-tier gitleaks license, required only for ORGANIZATION-owned
          repositories. Personal and public repositories ignore it entirely.
        required: false

permissions: {}

jobs:
  scan:
    name: '🔍 Scan for Secrets'
    # SKIPPED IN A MERGE QUEUE, AND SO PASSED. The pinned gitleaks action
    # takes push, pull_request, workflow_dispatch and schedule, and exits 1
    # on any other event, so on `merge_group` this required check failed
    # every queued pull request. A merge group carries the commits each
    # pull request's own run already scanned, and the push that lands it on
    # the default branch is scanned like any other. GitHub reports a job
    # skipped inside a called workflow as Success, which a required check
    # accepts.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # full-history checkout for the secret scan
      issues: write # one-time escalation issue when scanning is silently off

    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🔐 Security Scan: checking for leaked secrets using Gitleaks.'

      # Full history: a secret deleted in a later commit is still leaked.
      - name: '📂 Checkout Calling Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # gitleaks-action is free for personal and public repositories.
      # Organization-owned repositories need a (free-tier) GITLEAKS_LICENSE;
      # without it the action errors outright. Because this is a REQUIRED
      # merge check, a hard failure would block EVERY merge in a new
      # org-owned repository until someone added the secret. Instead, skip
      # the scan so the required check still reports, and make the gap loud
      # enough that nobody mistakes a green check for a scanned repository.
      - name: '🔑 Preflight: organization license check'
        id: preflight
        env:
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          HAS_LICENSE: ${{ secrets.GITLEAKS_LICENSE != '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$OWNER_TYPE" = "Organization" ] && [ "$HAS_LICENSE" != "true" ]; then
            echo "scan=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Secret scan skipped (GITLEAKS_LICENSE not set)::This repository is owned by a GitHub organization, and gitleaks-action requires a free-tier GITLEAKS_LICENSE secret for org-owned repositories. Secret scanning is SKIPPED so this required check stays green - your PRs are NOT being scanned for leaked credentials. Get a free key at https://gitleaks.io and add it under Settings > Secrets and variables > Actions as GITLEAKS_LICENSE to turn scanning on."
            # A green check with scanning silently off is easy to never
            # notice: escalate ONCE with an issue. Deduplicated against
            # every state, so closing the issue counts as acknowledgement
            # and it is never re-opened; entirely best-effort - a token
            # without issues scope must never fail the required check.
            TITLE="🔍 Secret scanning is OFF - add the free GITLEAKS_LICENSE secret"
            EXISTING="$(gh issue list --search 'in:title GITLEAKS_LICENSE' --state all --json number --jq '.[0].number // empty' 2>/dev/null || true)"
            if [ -z "$EXISTING" ]; then
              BODY="This repository is owned by a GitHub **organization**, and gitleaks-action requires a (free-tier) \`GITLEAKS_LICENSE\` secret on org-owned repositories.

          Until one is added, the required **🔍 Scan for Secrets** check passes with the scan **skipped** - pull requests are NOT being scanned for leaked credentials.

          **Fix (once):** get a free key at https://gitleaks.io and add it under **Settings → Secrets and variables → Actions** as \`GITLEAKS_LICENSE\`. The very next run scans for real.

          Closing this issue acknowledges the gap - it will not be re-opened."
              gh issue create --title "$TITLE" --body "$BODY" --label 'type: security' 2>/dev/null \
                || gh issue create --title "$TITLE" --body "$BODY" 2>/dev/null \
                || echo "::notice::Could not open the escalation issue (token without issues scope) - the warning above is the only signal."
            fi
          else
            echo "scan=true" >> "$GITHUB_OUTPUT"
          fi

      # Everywhere but a private repository's pull request, which the next
      # step scans instead.
      - name: '🔍 Run Gitleaks'
        if: ${{ steps.preflight.outputs.scan == 'true' && !(github.event_name == 'pull_request' && github.event.repository.private) }}
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wired for org-owned repositories that provision the free-tier
          # license; empty (and ignored) for personal and public repos.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

      # A PRIVATE REPOSITORY'S PULL REQUEST IS SCANNED HERE, NOT BY THE
      # ACTION. On `pull_request` the action first lists the pull request's
      # commits through the API, and a private repository answers that only
      # to a token holding `pull-requests: read`. Under the ceiling above the
      # call was refused with a 403 before anything was scanned, so this
      # required check failed every pull request in every private
      # repository. Asking for the scope would instead fail, at startup,
      # every stub that does not grant it, so the same gitleaks scans the
      # same commits from the full-history checkout, which needs nothing
      # beyond `contents: read`.
      #
      # The version is the one the pinned action installs: move the two
      # together. The tarball is pinned by the SHA-256 its release publishes,
      # so a scanner that gates every merge never runs unverified.
      - name: '🔍 Run Gitleaks (private pull request)'
        if: ${{ steps.preflight.outputs.scan == 'true' && github.event_name == 'pull_request' && github.event.repository.private }}
        env:
          GITLEAKS_VERSION: '8.24.3'
          GITLEAKS_SHA256: '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c'
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          TARBALL="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${TARBALL}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${TARBALL}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${TARBALL}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${TARBALL}" -C "${RUNNER_TEMP}" gitleaks
          # The pull request's own commits, as the action takes them: first
          # parents only, merges left out, and exit code 2 on a finding.
          "${RUNNER_TEMP}/gitleaks" git --redact --verbose --exit-code 2 \
            --log-opts="--no-merges --first-parent ${BASE_SHA}..${HEAD_SHA}" .

      - name: '📝 Report Failure'
        if: ${{ failure() }}
        run: |
          echo "::error title=Secret scan::Gitleaks step failed. If it exited on findings, secrets were detected - review the log and ROTATE any exposed credentials immediately. If it failed to run (org license, network, checkout), fix the action error; this is a required merge check."
          {
            echo "### 🚨 Scan for Secrets failed"
            echo ""
            echo "This step fails in two distinct cases - check the run log to tell which:"
            echo ""
            echo "1. **Secrets detected:** Gitleaks found potential secrets (keys, passwords, tokens). Remove them from history and **rotate the exposed credentials** - assume they are compromised."
            echo "2. **Failed to run:** an org-license, network, or checkout error, not a finding. Fix the action error and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
