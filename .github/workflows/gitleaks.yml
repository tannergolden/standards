# --- Reusable Workflow ---
#
# 🔐 Scan for Secrets
#
# Purpose: scans a repository's full history for committed secrets,
# credentials, and tokens. History depth matters here: a secret removed in a
# later commit is still a leaked secret, so this checks out everything rather
# than the tip.
#
# RULESET-LOAD-BEARING JOB NAME: '🔍 Scan for Secrets' is a required status
# check. A caller reports it as '<job id> / 🔍 Scan for Secrets', which is
# why the stub job id is fixed at `secrets` (see data/README.md). Renaming
# either half leaves branch protection waiting on a check that never
# reports, which blocks every merge and looks like a hung pull request
# rather than a naming mistake.
#
# Called, not triggered. A consuming repository adds a stub:
#
#   name: '🔐 Scan for Secrets'
#   on:
#     push:
#       branches: ['Experimental', 'Development', 'Preview', 'Release']
#     pull_request:
#       branches: ['Experimental', 'Development', 'Preview', 'Release']
#     merge_group: # a merge queue waits on every required check
#     workflow_dispatch:
#   concurrency:
#     group: ${{ github.workflow }}-${{ github.ref }}
#     cancel-in-progress: false
#   permissions: {}
#   jobs:
#     secrets: # <- fixed by the rulesets. Do not rename.
#       permissions:
#         contents: read # full-history checkout for the secret scan
#         issues: write # declared by the job, so a stub grants it too
#       uses: tannergolden/standards/.github/workflows/gitleaks.yml@v1
#       secrets: inherit
#
# ---

name: '🔐 Scan for Secrets'

on:
  workflow_call:
    secrets:
      # Read by nothing since the scan stopped using gitleaks-action, the
      # one part that needed a license. Still declared so that a caller
      # passing it by name starts, rather than failing on a secret this
      # workflow no longer knows.
      GITLEAKS_LICENSE:
        description: >-
          No longer read: the scan runs gitleaks itself, which needs no
          license on any repository.
        required: false

permissions: {}

jobs:
  scan:
    name: '🔍 Scan for Secrets'
    # SKIPPED IN A MERGE QUEUE, AND SO PASSED. A merge group carries the
    # commits each pull request's own run already scanned, and the push that
    # lands it on the default branch is scanned like any other. GitHub
    # reports a job skipped inside a called workflow as Success, which a
    # required check accepts.
    if: ${{ github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # full-history checkout for the secret scan
      # Used by nothing since the scan stopped needing a license, which is
      # when it opened its escalation issue. Still declared because every
      # stub grants it, and 🔬 Verify Stub Ceilings fails a stub that grants
      # more than the job declares; it can go once the stubs drop it.
      issues: write # unused, and declared because every stub grants it

    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/.github/actions/harden@v1
        with:
          egress-policy: audit
          notice: '🔐 Security Scan: checking for leaked secrets using Gitleaks.'

      # Full history: a secret deleted in a later commit is still leaked.
      - name: '📂 Checkout Calling Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # gitleaks at the version the environment pins, checked against its
      # SHA-256 before it runs: the same binary the image and every cloud
      # session hold.
      - name: '🧰 Toolchain'
        uses: tannergolden/environment/.github/actions/toolchain@v1

      # ONE SCAN, FROM THE CHECKOUT, FOR EVERY EVENT. It takes what
      # gitleaks-action took: a pull request's own commits, first parents
      # only and merges left out; a push's commits; on a dispatch or the
      # weekly schedule, the whole history. A pull request's commits come
      # from its base and head in the event rather than from the pull
      # request API, which a private repository answers only to a token
      # holding `pull-requests: read`; asking for that scope would fail, at
      # startup, every stub that does not grant it. --redact keeps every
      # secret out of the log, and a finding exits 2 and fails the check.
      - name: '🔍 Run Gitleaks'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/gitleaks.json"
          scope=()
          case "$EVENT" in
            pull_request)
              scope=(--log-opts="--no-merges --first-parent ${BASE_SHA}..${HEAD_SHA}")
              ;;
            push)
              first="$(jq -r '.commits[0].id // empty' "$GITHUB_EVENT_PATH")"
              last="$(jq -r '.commits[-1].id // empty' "$GITHUB_EVENT_PATH")"
              if [ -z "$first" ]; then
                echo "This push carries no commits, so there is nothing to scan."
                exit 0
              fi
              # A push that starts a repository has no parent to count from.
              if git rev-parse --quiet --verify "${first}^" >/dev/null; then
                scope=(--log-opts="--no-merges --first-parent ${first}^..${last}")
              else
                scope=(--log-opts="--no-merges --first-parent ${last}")
              fi
              ;;
            workflow_dispatch | schedule) ;;
            *)
              echo "::error title=Secret scan::'${EVENT}' is not an event this scan knows the commits of."
              exit 1
              ;;
          esac
          status=0
          gitleaks git --redact --verbose --exit-code 2 \
            --report-format json --report-path "$report" "${scope[@]}" . || status=$?
          if [ "$status" -eq 2 ] && [ -s "$report" ]; then
            {
              echo "### 🛑 Gitleaks found secrets"
              echo ""
              echo "| Rule | File | Line | Commit |"
              echo "| :--- | :--- | ---: | :--- |"
              jq -r '.[] | "| \(.RuleID) | `\(.File)` | \(.StartLine) | `\(.Commit[0:12])` |"' "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            echo "### ✅ Gitleaks found no secrets" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: '📝 Report Failure'
        if: ${{ failure() }}
        run: |
          echo "::error title=Secret scan::Gitleaks step failed. If it exited on findings, secrets were detected - review the log and ROTATE any exposed credentials immediately. If it failed to run (toolchain, network, checkout), fix that error; this is a required merge check."
          {
            echo "### 🚨 Scan for Secrets failed"
            echo ""
            echo "This step fails in two distinct cases - check the run log to tell which:"
            echo ""
            echo "1. **Secrets detected:** Gitleaks found potential secrets (keys, passwords, tokens). Remove them from history and **rotate the exposed credentials** - assume they are compromised."
            echo "2. **Failed to run:** a toolchain, network, or checkout error, not a finding. Fix the error and re-run."
          } >> "$GITHUB_STEP_SUMMARY"
