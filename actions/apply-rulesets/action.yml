# --- Composite Action (forwarder) ---
#
# 🛡️ Apply Rulesets, at its old address
#
# This action moved to .github/actions/apply-rulesets/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/apply-rulesets@v1
#
# ---
name: '🛡️ Apply Rulesets'
description: 'Creates or updates the published branch and tag rulesets on a repository, matched by name.'

inputs:
  token:
    description: 'Token that can administer the target repository. The default GITHUB_TOKEN cannot write rulesets, so this needs a PAT or app token with administration write.'
    required: true
  repository:
    description: 'Repository to apply the rulesets to, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  rulesets-dir:
    description: 'Directory of ruleset JSON in the CALLING repository. Empty uses the published set.'
    required: false
    default: ''
  dry-run:
    description: 'Print what would be applied and change nothing. This action defaults it to false because a caller passing nothing has asked for the thing to happen; the script defaults it to TRUE for a hand-run, where nobody has declared an intent yet. `apply-standards.yml` always passes it through.'
    required: false
    default: 'false'
  require-checks:
    description: 'Refuse to apply a ruleset whose required status checks no workflow in the target repository can report. Leave this on: a check that never reports leaves every pull request PENDING rather than failed, which blocks every merge in the repository with nothing anywhere to explain why. Turn it off only when the workflows are arriving in the same change.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/apply-rulesets'
      uses: 'tannergolden/standards/.github/actions/apply-rulesets@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        rulesets-dir: '${{ inputs.rulesets-dir }}'
        dry-run: '${{ inputs.dry-run }}'
        require-checks: '${{ inputs.require-checks }}'
