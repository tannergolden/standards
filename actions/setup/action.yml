# --- Composite Action (forwarder) ---
#
# 🧰 Setup Toolchain, at its old address
#
# This action moved to .github/actions/setup/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/setup@v1
#
# ---
name: '🧰 Setup Toolchain'
description: 'Makes the toolchains a repository uses available, detected from the manifests in its tree.'

inputs:
  node-version:
    description: 'Node.js version, used when a package.json is present.'
    required: false
    default: '22.x'
  python-version:
    description: 'Python version, used when a Python manifest is present.'
    required: false
    default: '3.12'
  java-version:
    description: 'Preinstalled Java major version to select, used when a Maven or Gradle build file is present. Falls back to the image default if the runner does not carry it.'
    required: false
    default: '21'
  cache:
    description: 'Enable dependency caching where a lockfile makes it safe. Turn this off for jobs that publish artifacts, where a poisoned cache could reach a release.'
    required: false
    default: 'true'
  install:
    description: "Run the repository's own dependency install after the toolchains are available. Set to false for jobs that only need a runtime present."
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/setup'
      uses: 'tannergolden/standards/.github/actions/setup@v1'
      with:
        node-version: '${{ inputs.node-version }}'
        python-version: '${{ inputs.python-version }}'
        java-version: '${{ inputs.java-version }}'
        cache: '${{ inputs.cache }}'
        install: '${{ inputs.install }}'
