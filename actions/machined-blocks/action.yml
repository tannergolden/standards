# --- Composite Action (forwarder) ---
#
# 🧠 Machined Block Check, at its old address
#
# This action moved to .github/actions/machined-blocks/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/machined-blocks@v1
#
# ---
name: '🧠 Machined Block Check'
description: 'Verifies every hash-marked block in the repository still matches the hash its marker carries.'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/machined-blocks'
      uses: 'tannergolden/standards/.github/actions/machined-blocks@v1'
