# --- Composite Action (forwarder) ---
#
# 🔄 Template Sync, at its old address
#
# This action moved to .github/actions/template-sync/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/template-sync@v1
#
# ---
name: '🔄 Template Sync'
description: "Syncs a generated repository's scaffold from its template, checks a template's sync list, or tracks what waits on the owner."

inputs:
  mode:
    description: "`run` syncs this repository, `check` checks a template's list, `track` keeps the waiting-files issue current."
    required: false
    default: 'run'
  template-dir:
    description: 'A clone of the template, bare or not, with its tags. Needed for `run`.'
    required: false
    default: ''
  template:
    description: 'The template as owner/repo. Empty takes it from the lock.'
    required: false
    default: ''
  ref:
    description: 'The template tag, or branch, to follow.'
    required: false
    default: 'v1'
  workflow-files:
    description: 'Whether the token pushing the result can write .github/workflows/. `false` holds those files back, keeps them waiting, and says so; `auto` decides from `workflow-token`.'
    required: false
    default: 'true'
  workflow-token:
    description: 'With `workflow-files: auto`, the token that will push the result. None holds workflow files back; so does a classic token without the `workflow` scope. A fine-grained or App token names no scopes and is trusted to have been made with Workflows write.'
    required: false
    default: ''
  name:
    description: "The owner's display name. Used only to recover a lock that was never written."
    required: false
    default: ''
  repository:
    description: 'This repository, as owner/repo. Used by `track`.'
    required: false
    default: '${{ github.repository }}'
  version:
    description: 'The template version just synced. Used by `track` when it closes the issue.'
    required: false
    default: ''
  map:
    description: 'A mapping file, for a repository defined as a delta of its template rather than generated from it. Empty for a generated repository.'
    required: false
    default: ''

outputs:
  changed:
    description: '`true` when the working tree now holds something to propose.'
    value: '${{ steps.forward.outputs.changed }}'
  clean:
    description: '`true` when nothing waits on the owner: no conflict, nothing held for a token.'
    value: '${{ steps.forward.outputs.clean }}'
  pending:
    description: 'How many files wait on the owner.'
    value: '${{ steps.forward.outputs.pending }}'
  version:
    description: 'The template version synced to, such as v1.4.0.'
    value: '${{ steps.forward.outputs.version }}'
  pr-title:
    description: 'A Conventional Commit title for the pull request.'
    value: '${{ steps.forward.outputs.pr-title }}'
  commit-title:
    description: "A Conventional Commit title for the commit, with this run's file count."
    value: '${{ steps.forward.outputs.commit-title }}'
  report:
    description: 'The pull request body: what changed, what waits, and why.'
    value: '${{ steps.forward.outputs.report }}'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/template-sync'
      id: 'forward'
      uses: 'tannergolden/standards/.github/actions/template-sync@v1'
      with:
        mode: '${{ inputs.mode }}'
        template-dir: '${{ inputs.template-dir }}'
        template: '${{ inputs.template }}'
        ref: '${{ inputs.ref }}'
        workflow-files: '${{ inputs.workflow-files }}'
        workflow-token: '${{ inputs.workflow-token }}'
        name: '${{ inputs.name }}'
        repository: '${{ inputs.repository }}'
        version: '${{ inputs.version }}'
        map: '${{ inputs.map }}'
