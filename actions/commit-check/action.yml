# --- Composite Action (forwarder) ---
#
# ✍️ Commit Message Check, at its old address
#
# This action moved to .github/actions/commit-check/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/commit-check@v1
#
# ---
name: '✍️ Commit Message Check'
description: 'Verifies every human-authored commit in a pull request follows Conventional Commits.'

inputs:
  token:
    description: 'Token used to read the pull request commits.'
    required: true
  pr-number:
    description: 'Pull request number whose commits are checked.'
    required: true
  repository:
    description: 'Repository holding the pull request, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  types:
    description: 'Comma-separated Conventional Commit types accepted. Keep this in step with the types the title check allows, or a message can pass one gate and fail the other.'
    required: false
    default: 'feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert,security'
  max-header-length:
    description: 'Maximum length of the subject line.'
    required: false
    default: '100'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/commit-check'
      uses: 'tannergolden/standards/.github/actions/commit-check@v1'
      with:
        token: '${{ inputs.token }}'
        pr-number: '${{ inputs.pr-number }}'
        repository: '${{ inputs.repository }}'
        types: '${{ inputs.types }}'
        max-header-length: '${{ inputs.max-header-length }}'
