# --- Composite Action (forwarder) ---
#
# 🧹 Prune Deployments, at its old address
#
# This action moved to .github/actions/prune-deployments/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/prune-deployments@v1
#
# ---
name: '🧹 Prune Deployments'
description: 'Deletes superseded deployments, keeping the current successful one per environment.'

inputs:
  token:
    description: 'Token used to prune. Needs deployments: write.'
    required: true
  repository:
    description: 'Repository to prune, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  only:
    description: 'Comma-separated environments to prune. Empty means all of them.'
    required: false
    default: ''
  exclude:
    description: 'Comma-separated environments to leave alone.'
    required: false
    default: ''
  dry-run:
    description: 'Log what would be deleted and delete nothing.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/prune-deployments'
      uses: 'tannergolden/standards/.github/actions/prune-deployments@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        only: '${{ inputs.only }}'
        exclude: '${{ inputs.exclude }}'
        dry-run: '${{ inputs.dry-run }}'
