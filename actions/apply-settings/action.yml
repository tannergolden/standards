# --- Composite Action (forwarder) ---
#
# ⚙️ Apply Repository Settings, at its old address
#
# This action moved to .github/actions/apply-settings/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/apply-settings@v1
#
# ---
name: '⚙️ Apply Repository Settings'
description: "Brings a repository's settings in line with the published set, comparing before it writes."

inputs:
  token:
    description: 'Token that can administer the target repository. The default GITHUB_TOKEN cannot change repository settings, so this needs a PAT or app token with administration write, the same one the rulesets use. The run checks the token administers the repository before it compares anything, and names the fix when it does not.'
    required: true
  repository:
    description: 'Repository to configure, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  settings-file:
    description: 'Path to a settings JSON in the CALLING repository. Empty uses the published set. Name a file to depart from the standard deliberately rather than by drift; a key the script does not know, or one it never writes, is refused by name.'
    required: false
    default: ''
  dry-run:
    description: 'Print the plan and change nothing. This action defaults it to false because a caller passing nothing has asked for the thing to happen; the script defaults it to TRUE for a hand-run, where nobody has declared an intent yet.'
    required: false
    default: 'false'
  fail-on-drift:
    description: 'With dry-run: fail when the plan is not empty, so a scheduled dry run becomes a drift check. A healthy repository passes with `0 change(s)`; anything else fails naming every setting that differs. Ignored when dry-run is false, where the differences are applied instead.'
    required: false
    default: 'false'

outputs:
  changes:
    description: 'How many settings differ from the published set (and were applied, outside a dry run).'
    value: '${{ steps.forward.outputs.changes }}'
  unchanged:
    description: 'How many settings already matched.'
    value: '${{ steps.forward.outputs.unchanged }}'
  skipped:
    description: 'How many settings were skipped as unavailable on this repository, each with its reason in the plan.'
    value: '${{ steps.forward.outputs.skipped }}'
  failed:
    description: 'How many changes GitHub refused. Zero unless the step failed.'
    value: '${{ steps.forward.outputs.failed }}'
  drift:
    description: "'true' when anything differed from the published set, 'false' when nothing did."
    value: '${{ steps.forward.outputs.drift }}'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/apply-settings'
      id: 'forward'
      uses: 'tannergolden/standards/.github/actions/apply-settings@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        settings-file: '${{ inputs.settings-file }}'
        dry-run: '${{ inputs.dry-run }}'
        fail-on-drift: '${{ inputs.fail-on-drift }}'
