# --- Composite Action (forwarder) ---
#
# 🗂️ Frontmatter Check, at its old address
#
# This action moved to .github/actions/check-frontmatter/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/check-frontmatter@v1
#
# ---
name: '🗂️ Frontmatter Check'
description: 'Verifies every Markdown document opens with the hidden frontmatter the documentation standard defines.'

inputs:
  mode:
    description: 'enforce fails on a document that breaks the standard; warn reports it and passes.'
    required: false
    default: 'enforce'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/check-frontmatter'
      uses: 'tannergolden/standards/.github/actions/check-frontmatter@v1'
      with:
        mode: '${{ inputs.mode }}'
