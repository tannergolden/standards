# --- Composite Action (forwarder) ---
#
# ⬆️ Standards Version Check, at its old address
#
# This action moved to .github/actions/standards-version/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/standards-version@v1
#
# ---
name: '⬆️ Standards Version Check'
description: 'Opens one issue when a newer major of the shared standards is published.'

inputs:
  token:
    description: 'Token used to read releases and open the notice.'
    required: true
  repository:
    description: 'Repository whose stubs are inspected, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  standards-repository:
    description: 'Repository publishing the standards, as owner/repo.'
    required: false
    default: 'tannergolden/standards'
  workflow-dir:
    description: 'Directory holding the trigger stubs to inspect.'
    required: false
    default: '.github/workflows'
  label:
    description: 'Optional label applied to the notice. Empty applies none.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/standards-version'
      uses: 'tannergolden/standards/.github/actions/standards-version@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        standards-repository: '${{ inputs.standards-repository }}'
        workflow-dir: '${{ inputs.workflow-dir }}'
        label: '${{ inputs.label }}'
