# --- Composite Action (forwarder) ---
#
# 🛡️ Harden Runner, at its old address
#
# This action moved to .github/actions/harden/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/harden@v1
#
# ---
name: '🛡️ Harden Runner'
description: 'Audits or blocks runner egress, and posts the job notice.'

inputs:
  egress-policy:
    description: "'audit' records outbound connections without blocking them. 'block' denies everything outside allowed-endpoints."
    required: false
    default: 'audit'
  allowed-endpoints:
    description: 'Newline-separated endpoints permitted under `block`. Ignored when the policy is `audit`, where nothing is denied in the first place.'
    required: false
    default: ''
  notice:
    description: 'One line describing what this job does, surfaced as an annotation on the run. Leave empty to post nothing.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/harden'
      uses: 'tannergolden/standards/.github/actions/harden@v1'
      with:
        egress-policy: '${{ inputs.egress-policy }}'
        allowed-endpoints: '${{ inputs.allowed-endpoints }}'
        notice: '${{ inputs.notice }}'
