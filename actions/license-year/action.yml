# --- Composite Action ---
#
# 🕒 Update License Year
#
# Purpose: rewrites the copyright year in a repository's license records:
# the root LICENSE, the REUSE.toml blanket annotation, and every
# SPDX-FileCopyrightText header naming the given copyright holder.
#
# The holder is an anchor rather than a wildcard, so headers naming anyone
# else survive untouched. Vendored fonts and third-party sources carry their
# own holders, and rewriting those would misattribute somebody else's
# copyright, which is worse than a stale year.
#
# Changes the working tree and nothing else. Committing and delivering the
# result is the caller's job, normally through actions/open-pr.
#
# Used as:
#
#   - uses: tannergolden/standards/actions/license-year@v1
#     id: license
#     with:
#       copyright-holder: 'Tanner Golden'
#
# ---

name: '🕒 Update License Year'
description: 'Rolls the copyright year across LICENSE, REUSE.toml, and matching SPDX headers.'

inputs:
  copyright-holder:
    description: >-
      Name anchoring which SPDX headers are rewritten; other holders are
      left alone. Empty resolves the repository owner's display name, which
      is the right default in anyone's repository.
    required: false
    default: ''

outputs:
  year:
    description: 'The year written.'
    value: ${{ steps.roll.outputs.year }}
  changed:
    description: 'Number of files this run actually modified.'
    value: ${{ steps.roll.outputs.changed }}
  scanned:
    description: 'Number of SPDX header files inspected.'
    value: ${{ steps.roll.outputs.scanned }}

runs:
  using: composite
  steps:
    - name: '🕒 Roll the copyright year'
      id: roll
      shell: bash
      env:
        COPYRIGHT_HOLDER: ${{ inputs.copyright-holder }}
        GH_TOKEN: ${{ github.token }}
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/update-license-year.sh"
