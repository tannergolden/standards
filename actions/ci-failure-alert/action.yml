# --- Composite Action (forwarder) ---
#
# 🚨 Escalate or Resolve a CI Failure, at its old address
#
# This action moved to .github/actions/ci-failure-alert/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/ci-failure-alert@v1
#
# ---
name: '🚨 Escalate or Resolve a CI Failure'
description: 'Opens an issue when a watched workflow fails and closes it when the workflow recovers.'

inputs:
  token:
    description: 'Token used to open and close the issue. Needs issues: write.'
    required: true
  repository:
    description: 'Repository the issue belongs to, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  workflow-name:
    description: 'Name of the workflow that completed. Deduplication is keyed to it.'
    required: true
  conclusion:
    description: "The run's conclusion: 'failure' escalates, 'success' resolves."
    required: true
  branch:
    description: 'Branch the run was on.'
    required: true
  run-url:
    description: 'Link to the run, so the issue points at the evidence.'
    required: true
  head-sha:
    description: 'Commit the run was against.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/ci-failure-alert'
      uses: 'tannergolden/standards/.github/actions/ci-failure-alert@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        workflow-name: '${{ inputs.workflow-name }}'
        conclusion: '${{ inputs.conclusion }}'
        branch: '${{ inputs.branch }}'
        run-url: '${{ inputs.run-url }}'
        head-sha: '${{ inputs.head-sha }}'
