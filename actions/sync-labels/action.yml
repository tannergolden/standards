# --- Composite Action (forwarder) ---
#
# 🏷️ Sync Labels, at its old address
#
# This action moved to .github/actions/sync-labels/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/sync-labels@v1
#
# ---
name: '🏷️ Sync Labels'
description: 'Applies the shared label taxonomy to a repository, create-or-update, never pruning.'

inputs:
  token:
    description: 'Token used to write labels. Needs issues: write.'
    required: true
  repository:
    description: 'Repository to apply the taxonomy to, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  labels-file:
    description: |-
      Path to a replacement taxonomy in the CALLING repository. Empty uses the shared one, which is the intended default.
      ⚠️ Empty resolves the taxonomy from THIS ACTION'S ref - the published release - not from the calling repository's tree. A repository editing the registry and applying it to itself must name the file, or it will install the last release's taxonomy and see no change.
    required: false
    default: ''
  dry-run:
    description: 'Log the plan and write nothing. The calling workflow advertises a dry run; without this input the label sync wrote regardless, which made that promise false for the one job that is hardest to undo.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/sync-labels'
      uses: 'tannergolden/standards/.github/actions/sync-labels@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        labels-file: '${{ inputs.labels-file }}'
        dry-run: '${{ inputs.dry-run }}'
