# --- Composite Action ---
#
# 🏷️ Sync Labels
#
# Purpose: applies the shared label taxonomy to a repository through the
# GitHub API. Create-or-update for every declared label, never pruning, so
# labels a repository added for its own reasons survive the sync.
#
# Renames are first class. An entry carrying `renamed_from:` is MOVED onto
# its new identity with a PATCH whenever the old name still exists, so every
# issue and pull request already labeled travels with it. Without that, a
# rename would orphan the old label in every repository holding it and quietly
# empty every saved filter that named it. The move is one-shot and
# idempotent: once the old name is gone, the entry behaves like any other.
#
# Both the taxonomy and the script travel with this action, which is the only
# reason this can work at all: a reusable workflow's checkout resolves to the
# calling repository and would find neither.
#
# Used as:
#
#   - uses: tannergolden/standards/actions/sync-labels@v1
#     with:
#       token: ${{ secrets.GITHUB_TOKEN }}
#
# ---

name: '🏷️ Sync Labels'
description: 'Applies the shared label taxonomy to a repository, create-or-update, never pruning.'

inputs:
  token:
    description: 'Token used to write labels. Needs issues: write.'
    required: true
  repository:
    description: 'Repository to apply the taxonomy to, as owner/repo.'
    required: false
    default: ${{ github.repository }}
  labels-file:
    description: >-
      Path to a replacement taxonomy in the CALLING repository. Empty uses
      the shared one, which is the intended default.

      ⚠️ Empty resolves the taxonomy from THIS ACTION'S ref - the published
      release - not from the calling repository's tree. A repository editing
      the registry and applying it to itself must name the file, or it will
      install the last release's taxonomy and see no change.
    required: false
    default: ''
  dry-run:
    description: >-
      Log the plan and write nothing. The calling workflow advertises a dry
      run; without this input the label sync wrote regardless, which made
      that promise false for the one job that is hardest to undo.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: '📄 Resolve label taxonomy'
      id: taxonomy
      shell: bash
      env:
        OVERRIDE: ${{ inputs.labels-file }}
      run: |
        set -euo pipefail
        if [ -n "$OVERRIDE" ]; then
          if [ ! -f "$OVERRIDE" ]; then
            echo "::error title=Labels file not found::'${OVERRIDE}' does not exist in this repository."
            exit 1
          fi
          echo "file=${OVERRIDE}" >> "$GITHUB_OUTPUT"
        else
          echo "file=${GITHUB_ACTION_PATH}/../../data/labels.yml" >> "$GITHUB_OUTPUT"
        fi

    # NOT VALIDATED HERE. `scripts/sync-labels.sh` validates the whole
    # registry before its first write, with a real YAML parser and a
    # strictly larger rule set: name length, case-insensitive duplicates
    # (GitHub collides on those), a missing description, and a
    # `renamed_from` naming the label itself.
    #
    # A second, line-oriented copy used to live here and disagreed with it.
    # YAML doubles a single quote to escape it, so a 100-character
    # description containing one apostrophe measured 101 as raw text and
    # blocked the entire sync for a taxonomy the real validator accepts. Two
    # validators means two places to look and two places to be wrong.
    - name: '🔖 Apply labels'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ inputs.repository }}
        LABELS_FILE: ${{ steps.taxonomy.outputs.file }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${GITHUB_ACTION_PATH}/../../scripts/sync-labels.sh"
