# --- Composite Action (forwarder) ---
#
# 📄 Provide Shared Config, at its old address
#
# This action moved to .github/actions/config/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/config@v1
#
# ---
name: '📄 Provide Shared Config'
description: 'Resolves a shared configuration file to a path, honoring a calling repository override.'

inputs:
  name:
    description: "File name within this repository's config/ folder, such as zizmor.yml."
    required: true
  override:
    description: 'Path to a replacement in the CALLING repository. When set, it is returned as-is and the shared file is not used.'
    required: false
    default: ''

outputs:
  path:
    description: 'Path to the configuration file the workflow should read.'
    value: '${{ steps.forward.outputs.path }}'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/config'
      id: 'forward'
      uses: 'tannergolden/standards/.github/actions/config@v1'
      with:
        name: '${{ inputs.name }}'
        override: '${{ inputs.override }}'
