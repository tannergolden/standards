# --- Composite Action (forwarder) ---
#
# 🧹 Prune Workflow Runs, at its old address
#
# This action moved to .github/actions/prune-workflow-runs/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/prune-workflow-runs@v1
#
# ---
name: '🧹 Prune Workflow Runs'
description: 'Deletes old workflow runs, keeping recent ones and anything tied to recent commits.'

inputs:
  token:
    description: 'Token used to prune. Needs actions: write and contents: read.'
    required: true
  repository:
    description: 'Repository to prune, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  keep:
    description: 'How many recent runs to keep per workflow.'
    required: false
    default: '1'
  keep-recent-days:
    description: 'Never delete a COMMIT-TRIGGERED run started within this many days. Time alone is not enough: a schedule or a dispatch fires without anyone committing, and that is the history this clears. 0 disables.'
    required: false
    default: '0'
  keep-recent-commits:
    description: 'Never delete runs from this many latest default-branch commits. The default of 35 is one page of the commit-history view.'
    required: false
    default: '35'
  dry-run:
    description: 'Log what would be deleted and delete nothing.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/prune-workflow-runs'
      uses: 'tannergolden/standards/.github/actions/prune-workflow-runs@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        keep: '${{ inputs.keep }}'
        keep-recent-days: '${{ inputs.keep-recent-days }}'
        keep-recent-commits: '${{ inputs.keep-recent-commits }}'
        dry-run: '${{ inputs.dry-run }}'
