# --- Composite Action (forwarder) ---
#
# 🗂️ Update Machined Indexes, at its old address
#
# This action moved to .github/actions/update-indexes/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/update-indexes@v1
#
# ---
name: '🗂️ Update Machined Indexes'
description: 'Regenerates, or checks, every machined index in a repository: folder logs, record registers and document lists.'

inputs:
  mode:
    description: '`write` regenerates every stale block in place and changes nothing else; `check` fails when any block is stale and writes nothing.'
    required: false
    default: 'write'

outputs:
  updated:
    description: 'How many files the write mode changed. Always 0 in check mode.'
    value: '${{ steps.forward.outputs.updated }}'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/update-indexes'
      id: 'forward'
      uses: 'tannergolden/standards/.github/actions/update-indexes@v1'
      with:
        mode: '${{ inputs.mode }}'
