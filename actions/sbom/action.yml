# --- Composite Action (forwarder) ---
#
# 🧾 Generate SBOM, at its old address
#
# This action moved to .github/actions/sbom/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/sbom@v1
#
# ---
name: '🧾 Generate SBOM'
description: 'Writes a CycloneDX or SPDX dependency inventory for any ecosystem, from the checked-out tree.'

inputs:
  output:
    description: 'Where to write the SBOM. Parent directories are created.'
    required: false
    default: 'sbom.cdx.json'
  format:
    description: 'SBOM format, as the generator names it: cyclonedx-json, spdx-json, syft-json, or any other it supports.'
    required: false
    default: 'cyclonedx-json'
  source:
    description: 'What to catalog. `dir:.` reads the working tree; `docker:image:tag` reads a built image instead.'
    required: false
    default: 'dir:.'
  generator-version:
    description: 'Pin the generator, as 1.2.3 or v1.2.3. Empty resolves the current release, which is the right default for a tool that only describes the build and never touches the artifact.'
    required: false
    default: ''
  strict:
    description: 'Fail the step when no SBOM could be produced, instead of warning.'
    required: false
    default: 'false'
  token:
    description: 'Token used only to look up the generator release. Optional, and worth passing: the anonymous API is rate limited per IP, which a shared runner pool hits in practice.'
    required: false
    default: ''

outputs:
  generated:
    description: 'true when an SBOM was written, false when the step gave up.'
    value: '${{ steps.forward.outputs.generated }}'
  path:
    description: 'Path to the SBOM that was written, empty when none was.'
    value: '${{ steps.forward.outputs.path }}'
  packages:
    description: 'Number of packages cataloged.'
    value: '${{ steps.forward.outputs.packages }}'
  generator-version:
    description: 'Exact generator version used, so the run is reconstructable.'
    value: '${{ steps.forward.outputs.generator-version }}'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/sbom'
      id: 'forward'
      uses: 'tannergolden/standards/.github/actions/sbom@v1'
      with:
        output: '${{ inputs.output }}'
        format: '${{ inputs.format }}'
        source: '${{ inputs.source }}'
        generator-version: '${{ inputs.generator-version }}'
        strict: '${{ inputs.strict }}'
        token: '${{ inputs.token }}'
