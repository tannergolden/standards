# --- Composite Action (forwarder) ---
#
# 🎉 Initialise From Template, at its old address
#
# This action moved to .github/actions/init-template/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/init-template@v1
#
# ---
name: '🎉 Initialise From Template'
description: "Rewrites a generated repository's identity to its new owner and deletes what only the template needs, once, then disables itself."

inputs:
  token:
    description: 'Token used to read the owner profile and push the result.'
    required: true
  repository:
    description: 'Generated repository, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  owner:
    description: 'Account that now owns the repository.'
    required: false
    default: '${{ github.repository_owner }}'
  sentinel:
    description: 'Marker file whose presence means "not yet initialised". Removed on success, which is what makes this run exactly once.'
    required: false
    default: '.github/TEMPLATE_INIT'
  template-owner:
    description: 'Account that owns the template, whose identity is being replaced.'
    required: false
    default: 'tannergolden'
  is-template:
    description: 'Whether THIS repository is itself a template. True refuses to run, which is what stops the template initialising itself and deleting its own sentinel. Matched on the flag rather than on a repository name, so renaming the template cannot break it.'
    required: false
    default: '${{ github.event.repository.is_template }}'
  default-branch:
    description: 'Branch to push to. Empty uses the checked-out branch.'
    required: false
    default: ''
  amend-initial:
    description: 'Rewrite the generation commit into a Conventional Commit when it is the only commit present. Off leaves it and adds a second commit instead.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/init-template'
      uses: 'tannergolden/standards/.github/actions/init-template@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        owner: '${{ inputs.owner }}'
        sentinel: '${{ inputs.sentinel }}'
        template-owner: '${{ inputs.template-owner }}'
        is-template: '${{ inputs.is-template }}'
        default-branch: '${{ inputs.default-branch }}'
        amend-initial: '${{ inputs.amend-initial }}'
