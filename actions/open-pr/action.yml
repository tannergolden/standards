# --- Composite Action (forwarder) ---
#
# 🚀 Open Maintenance Pull Request, at its old address
#
# This action moved to .github/actions/open-pr/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/open-pr@v1
#
# ---
name: '🚀 Open Maintenance Pull Request'
description: 'Commits working-tree changes to a fixed branch and opens or updates one evolving pull request.'

inputs:
  token:
    description: 'Token for pushing and for opening the pull request. The default GITHUB_TOKEN works but cannot push files under .github/workflows/, and the checks on a pull request it opens wait until someone with write access approves them; a PAT with repo and workflow scopes lifts both limits.'
    required: true
  branch:
    description: 'The fixed topic branch for this concern, such as style/auto-format.'
    required: true
  commit-title:
    description: 'Conventional Commit title. Pass run-specific measured values so each commit says what this run actually did rather than repeating a line.'
    required: true
  commit-body:
    description: 'Extended commit message body.'
    required: false
    default: ''
  pr-title:
    description: 'Pull request title, in Conventional Commit form.'
    required: true
  pr-body:
    description: 'Pull request body, as markdown.'
    required: true
  base:
    description: "Base branch the pull request targets. Empty resolves the repository's OWN default branch at run time, which is the right answer for anyone whose conventions differ from this repository's."
    required: false
    default: ''
  automerge:
    description: "Queue the pull request to squash-merge once required checks pass. Still gated on green CI, so nothing merges unvalidated. Needs 'Allow auto-merge' in repository settings."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/open-pr'
      uses: 'tannergolden/standards/.github/actions/open-pr@v1'
      with:
        token: '${{ inputs.token }}'
        branch: '${{ inputs.branch }}'
        commit-title: '${{ inputs.commit-title }}'
        commit-body: '${{ inputs.commit-body }}'
        pr-title: '${{ inputs.pr-title }}'
        pr-body: '${{ inputs.pr-body }}'
        base: '${{ inputs.base }}'
        automerge: '${{ inputs.automerge }}'
