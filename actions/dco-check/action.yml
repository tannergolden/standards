# --- Composite Action (forwarder) ---
#
# ✍️ DCO Sign-Off Check, at its old address
#
# This action moved to .github/actions/dco-check/, where every repository keeps
# its composite actions. This forwarder keeps the old address working for a
# caller pinned to v1: it passes every input on and hands every output back.
# Call the new address instead. The forwarder goes at the next major version.
#
#   - uses: tannergolden/standards/.github/actions/dco-check@v1
#
# ---
name: '✍️ DCO Sign-Off Check'
description: 'Verifies the Signed-off-by trailer on every human-authored commit in a pull request.'

inputs:
  token:
    description: 'Token used to read the pull request commits. Needs pull-requests: read.'
    required: true
  repository:
    description: 'Repository holding the pull request, as owner/repo.'
    required: false
    default: '${{ github.repository }}'
  pr-number:
    description: 'Number of the pull request to verify.'
    required: true

runs:
  using: 'composite'
  steps:
    - name: '↪️ Forward to .github/actions/dco-check'
      uses: 'tannergolden/standards/.github/actions/dco-check@v1'
      with:
        token: '${{ inputs.token }}'
        repository: '${{ inputs.repository }}'
        pr-number: '${{ inputs.pr-number }}'
