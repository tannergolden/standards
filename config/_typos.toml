# --- Shared Spell-Check Configuration ---
#
# The accepted-words list applied to a calling repository's prose and code.
# Entries are terms `typos` would otherwise flag: product names, acronyms,
# and domain vocabulary that is spelled correctly but sits outside its
# dictionary.
#
# Additive by design. A word missing here fails a build that should have
# passed, so err toward adding the term rather than rewording the sentence.
#
# ---

[files]
extend-exclude = [
  "_typos.toml",
  "lychee.md",
  "package-lock.json",
  ".config/",
  ".cursorrules",
  ".windsurfrules",
  "LICENSE",
]

