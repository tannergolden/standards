# --- Test Suite Configuration ---
#
# Root-level because pytest resolves its rootdir from where this file sits,
# and `tests/conftest.py` is imported by name from the test modules, which
# needs `tests/` on sys.path. `rootdir`-relative discovery gives both.
#
# This repository has no package manifest and no build system by design:
# the scripts are stdlib-only so they run on a bare runner. pytest is the
# one development dependency, installed by CI at a pinned version rather
# than resolved from a lockfile that does not exist.
#
# THE TEST FILES ARE KEBAB-CASE, LIKE EVERY SCRIPT HERE, and two settings
# below exist solely to support that. `python_files = *.py` collects them
# without the `test_` prefix pytest expects by default (`testpaths` keeps
# the net inside `tests/`, and pytest never collects `conftest.py`).
# `--import-mode=importlib` loads them, because a hyphenated file name is
# not a valid module identifier and the default prepend mode cannot import
# it. Drop either setting and collection quietly shrinks toward zero, but
# a run that collects nothing exits non-zero, so CI reddens rather than
# passing empty.
#
# ---

[pytest]
testpaths = tests
pythonpath = tests
python_files = *.py
addopts = --strict-markers --strict-config -ra --import-mode=importlib
xfail_strict = true
filterwarnings =
    error
